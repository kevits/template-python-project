[project]
name = "app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = ["ruff==0.16.7"]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src"

# ==============================
# uv Configuration
# ==============================

[tool.uv]
default-groups = ["dev"]

# ==============================
# Ruff Configuration
# ==============================

[tool.ruff]
cache-dir = ".cache/ruff"
extend-exclude = [".cache"]
indent-width = 4
line-length = 120
src = ["src"]

[tool.ruff.format]
indent-style = "space"
line-ending = "auto"
quote-style = "double"